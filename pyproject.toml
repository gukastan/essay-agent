[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["agent/contracts.py", "tests"]
exclude = ["**/__pycache__", "**/.venv"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# The supplied project has no copyright policy; do not invent legal attribution.
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
# This helper checks a predicate; its boolean argument is not a behavior toggle.
"agent/contract_base.py" = ["FBT001"]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
